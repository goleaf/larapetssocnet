name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      include_sqlite:
        description: Upload a freshly migrated and seeded SQLite database. Use only for first install because it overwrites remote data.
        required: false
        type: boolean
        default: false

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_URL: ${{ vars.APP_URL || 'https://petsocial.prus.dev' }}
      REMOTE_BASE: ${{ vars.REMOTE_BASE || '/home/anjdiiaev/domains/prus.dev/public_html/petsocial' }}
      INCLUDE_SQLITE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_sqlite && 'true' || 'false' }}
      MAIL_MAILER: ${{ vars.MAIL_MAILER || 'smtp' }}
      MAIL_SCHEME: ${{ vars.MAIL_SCHEME || 'null' }}
      MAIL_HOST: ${{ vars.MAIL_HOST || 'obojus.serveriai.lt' }}
      MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
      MAIL_USERNAME: ${{ vars.MAIL_USERNAME || 'robot@prus.dev' }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS || 'robot@prus.dev' }}
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'PetSocial' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, fileinfo, gd, intl, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install FTP archive client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends lftp zip

      - name: Validate deployment secrets
        env:
          FTP_HOST_SECRET: ${{ secrets.FTP_HOST }}
          FTP_USERNAME_SECRET: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD_SECRET: ${{ secrets.FTP_PASSWORD }}
          MAIL_PASSWORD_SECRET: ${{ secrets.MAIL_PASSWORD }}
        run: |
          test -n "${APP_KEY}" || { echo "Missing APP_KEY secret"; exit 2; }
          test -n "${FTP_HOST_SECRET}" || { echo "Missing FTP_HOST secret"; exit 2; }
          test -n "${FTP_USERNAME_SECRET}" || { echo "Missing FTP_USERNAME secret"; exit 2; }
          test -n "${FTP_PASSWORD_SECRET}" || { echo "Missing FTP_PASSWORD secret"; exit 2; }
          test -n "${MAIL_PASSWORD_SECRET}" || { echo "Missing MAIL_PASSWORD secret"; exit 2; }

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Create initial SQLite database
        if: ${{ env.INCLUDE_SQLITE == 'true' }}
        run: |
          touch database/database.sqlite
          DB_DATABASE="$PWD/database/database.sqlite" php artisan migrate --seed --force --no-interaction

      - name: Prepare FTP package
        run: scripts/prepare-ftp-deploy.sh

      - name: Deploy package with FTP archive
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'petsocial/' }}
          FTP_SSL_VERIFY: ${{ vars.FTP_SSL_VERIFY || 'true' }}
        run: scripts/deploy-ftp-archive.sh
